<ion-app>
  <ion-menu side="start" menuId="main-menu" contentId="main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Konek</ion-title>
      </ion-toolbar>
    </ion-header>

    <ion-content>
      @if (isAuthenticated) {
        <ion-item class="user-profile" lines="none">
          <ion-avatar slot="start">
            <ion-icon name="person-circle-outline"></ion-icon>
          </ion-avatar>
          <ion-label>
            <h4>{{ currentUser?.username }}</h4>
            <p>Signed in</p>
          </ion-label>
        </ion-item>
      }

      <ion-list lines="none" class="menu-list">
        @if (isAuthenticated) {
          <ion-item routerLink="/map" routerDirection="root" (click)="closeMenu()">
            <ion-icon name="map-outline" slot="start"></ion-icon>
            <ion-label>Map</ion-label>
          </ion-item>

          <ion-item routerLink="/squads" routerDirection="root" (click)="closeMenu()">
            <ion-icon name="people-outline" slot="start"></ion-icon>
            <ion-label>My squads</ion-label>
          </ion-item>

          <ion-item routerLink="/settings" routerDirection="root" (click)="closeMenu()">
            <ion-icon name="settings-outline" slot="start"></ion-icon>
            <ion-label>Settings</ion-label>
          </ion-item>

          <ion-item button (click)="signOut()">
            <ion-icon name="log-out-outline" slot="start" color="danger"></ion-icon>
            <ion-label color="danger">Sign out</ion-label>
          </ion-item>
        } @else {
          <ion-item routerLink="/login" routerDirection="root" (click)="closeMenu()">
            <ion-icon name="log-in-outline" slot="start"></ion-icon>
            <ion-label>Sign in</ion-label>
          </ion-item>

          <ion-item routerLink="/register" routerDirection="root" (click)="closeMenu()">
            <ion-icon name="person-add-outline" slot="start"></ion-icon>
            <ion-label>Create account</ion-label>
          </ion-item>
        }
      </ion-list>

      <div class="menu-footer">
        <p>Konek v1.0.0</p>
        <p>Stay connected with your squad</p>
      </div>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
