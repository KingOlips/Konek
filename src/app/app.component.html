<ion-app>
  <ion-menu side="start" menuId="main-menu" contentId="main-content">
    <ion-content class="menu-content">
      @if (isAuthenticated) {
        <div class="profile">
          <div class="profile-avatar">{{ initials }}</div>
          <div class="profile-meta">
            <strong>{{ currentUser?.username }}</strong>
            <span class="profile-pill"><i class="profile-dot"></i>Active</span>
          </div>
        </div>

        <p class="section-label">Navigation</p>
        <nav class="menu-nav">
          <a
            class="menu-row"
            routerLink="/map"
            routerDirection="root"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
          >
            <span class="menu-icon"><ion-icon name="map-outline"></ion-icon></span>
            <span class="menu-label">Map</span>
          </a>

          <a
            class="menu-row"
            routerLink="/squads"
            routerDirection="root"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
          >
            <span class="menu-icon"><ion-icon name="people-outline"></ion-icon></span>
            <span class="menu-label">My squads</span>
          </a>

          <a
            class="menu-row"
            routerLink="/settings"
            routerDirection="root"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: true }"
            (click)="closeMenu()"
          >
            <span class="menu-icon"><ion-icon name="settings-outline"></ion-icon></span>
            <span class="menu-label">Settings</span>
          </a>
        </nav>

        <p class="section-label">Account</p>
        <nav class="menu-nav">
          <button type="button" class="menu-row menu-danger" (click)="signOut()">
            <span class="menu-icon"><ion-icon name="log-out-outline"></ion-icon></span>
            <span class="menu-label">Sign out</span>
          </button>
        </nav>
      } @else {
        <p class="section-label">Account</p>
        <nav class="menu-nav">
          <a
            class="menu-row"
            routerLink="/login"
            routerDirection="root"
            (click)="closeMenu()"
          >
            <span class="menu-icon"><ion-icon name="log-in-outline"></ion-icon></span>
            <span class="menu-label">Sign in</span>
          </a>

          <a
            class="menu-row"
            routerLink="/register"
            routerDirection="root"
            (click)="closeMenu()"
          >
            <span class="menu-icon"><ion-icon name="person-add-outline"></ion-icon></span>
            <span class="menu-label">Create account</span>
          </a>
        </nav>
      }

      <div class="menu-footer">
        <p class="version">Konek v1.0.0</p>
        <p class="tagline">Stay connected with your squad</p>
      </div>
    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>
</ion-app>
